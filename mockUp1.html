<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초거대제조AI 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        ::-webkit-scrollbar-track { background-color: transparent; }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-50 text-slate-800">

    <!-- Sidebar (Default w-16 Collapsed for Mobile First) -->
    <aside id="sidebar" class="w-16 flex flex-col bg-[#191F28] shadow-xl z-10 transition-all duration-300 shrink-0">
        <div class="p-4 border-b border-white/10 flex items-center justify-center gap-2" id="sidebar-header">
            <div class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity min-w-0 hidden" id="logo-and-title" onclick="loadFile(files[0])">
                <div class="w-8 h-8 bg-white rounded-md flex items-center justify-center text-slate-900 font-extrabold text-sm shadow shrink-0">AI</div>
                <div class="sidebar-label min-w-0 hidden">
                    <h1 class="text-base font-bold text-white tracking-tight truncate">초거대제조AI</h1>
                    <p class="text-[10px] text-slate-400 tracking-tight truncate">Analytics Dashboard</p>
                </div>
            </div>
            <button id="sidebar-toggle" class="text-slate-400 hover:text-white transition-colors p-1 shrink-0 rounded hover:bg-white/10" title="사이드바 토글">
                <i class="fas fa-chevron-left text-xs transition-transform duration-300 rotate-180"></i>
            </button>
        </div>
        <nav id="file-list" class="flex-1 overflow-y-auto py-2 px-0 space-y-0.5"></nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <iframe id="viewer" class="flex-1 w-full h-full border-none"></iframe>
    </main>

    <script>
        const fileList = document.getElementById('file-list');
        const viewer = document.getElementById('viewer');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const toggleIcon = sidebarToggle.querySelector('i');
        const sidebarHeader = document.getElementById('sidebar-header');
        const logoAndTitle = document.getElementById('logo-and-title');

        const files = [
            { 
                name: "OVERVIEW", 
                path: "overview.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>` 
            },
            { 
                name: "PIPELINE", 
                path: "pipeline.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zm8 0a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2zm-4 8a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H9z"/><path fill-rule="evenodd" d="M6 7.5v2.5a2 2 0 002 2h2v-2H8V7.5H6zm8 0v2.5a2 2 0 01-2 2h-2v-2h2V7.5h2z" clip-rule="evenodd"/></svg>` 
            },
            { 
                name: "PARTNERS", 
                path: "partners.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 00-5 5v1h10v-1a5 5 0 00-5-5z"/></svg>` 
            },
        ];

        function loadFile(file) {
            viewer.src = file.path;
            updateActiveLink(file.path);
        }

        window.navigateToPage = function(path, filterType) {
            const targetUrl = filterType ? `${path}?type=${filterType}` : path;
            viewer.src = targetUrl;
            updateActiveLink(path);
        };

        function updateActiveLink(path) {
            const links = fileList.querySelectorAll('a');
            links.forEach(link => {
                const isActive = link.dataset.path === path;
                if (isActive) {
                    link.className = 'flex items-center w-full px-5 py-3 text-sm font-bold rounded-none bg-white text-[#191F28] transition-all duration-200 group';
                } else {
                    link.className = 'flex items-center w-full px-5 py-3 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white rounded-none transition-all duration-200 group';
                }
            });
        }

        files.forEach(file => {
            const a = document.createElement('a');
            a.href = '#';
            a.dataset.path = file.path;
            a.title = file.name;
            a.className = 'flex items-center w-full px-5 py-3 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white rounded-none transition-all duration-200 group';
            
            a.innerHTML = `
                <div class="sidebar-icon w-6 shrink-0 flex items-center justify-center">${file.svg}</div>
                <span class="sidebar-label truncate whitespace-nowrap hidden">${file.name}</span>
            `;
            
            a.onclick = (e) => {
                e.preventDefault();
                loadFile(file);
            };
            fileList.appendChild(a);
        });

        if (files.length > 0) {
            loadFile(files[0]);
        }

        function collapseSidebar() {
            const labels = document.querySelectorAll('.sidebar-label');
            const icons = document.querySelectorAll('.sidebar-icon');

            sidebar.classList.remove('w-56');
            sidebar.classList.add('w-16');
            logoAndTitle.classList.add('hidden');
            sidebarHeader.classList.remove('justify-between');
            sidebarHeader.classList.add('justify-center');
            labels.forEach(el => el.classList.add('hidden'));
            icons.forEach(el => el.classList.remove('hidden'));
            toggleIcon.classList.add('rotate-180');
        }

        function expandSidebar() {
            const labels = document.querySelectorAll('.sidebar-label');
            const icons = document.querySelectorAll('.sidebar-icon');

            sidebar.classList.remove('w-16');
            sidebar.classList.add('w-56');
            logoAndTitle.classList.remove('hidden');
            sidebarHeader.classList.remove('justify-center');
            sidebarHeader.classList.add('justify-between');
            labels.forEach(el => el.classList.remove('hidden'));
            icons.forEach(el => el.classList.add('hidden'));
            toggleIcon.classList.remove('rotate-180');
        }

        sidebarToggle.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.contains('w-16');
            if (isCollapsed) {
                expandSidebar();
            } else {
                collapseSidebar();
            }
        });

        // PC 화면(768px 이상)일 때만 펼쳐진 상태(w-56)로 변경, 모바일은 기본 접힌 상태(w-16) 유지
        if (window.innerWidth >= 768) {
            expandSidebar();
        } else {
            collapseSidebar();
        }
    </script>
</body>
</html>
