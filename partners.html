<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners - 초거대 제조 AI 참여기관</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="popup.js"></script>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        /* ── Modern Topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E2E8F0;
            padding: 0 28px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ── SaaS Card Design ── */
        .saas-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 14px 32px -4px rgba(15, 23, 42, 0.14), 0 6px 12px -2px rgba(15, 23, 42, 0.06);
            transform: translateY(-3px);
        }

        /* ── Filter Tab Buttons ── */
        .tab-pill {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #64748B;
            background: #F1F5F9;
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        .tab-pill:hover {
            background: #E2E8F0;
            color: #0F172A;
        }
        .tab-pill.active {
            background: #0F172A;
            color: #FFFFFF;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Top Navigation Header -->
    <div class="topbar shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            <span class="text-sm font-bold text-slate-900 tracking-tight">PARTNERS</span>
            <span class="text-xs text-slate-400 font-medium hidden sm:inline-block">| 총 15개 참여기관</span>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center gap-1.5 overflow-x-auto py-1">
            <button class="tab-pill active" onclick="filterCards('ALL')" id="tab-ALL">ALL (15)</button>
            <button class="tab-pill" onclick="filterCards('DATA')" id="tab-DATA">DATA</button>
            <button class="tab-pill" onclick="filterCards('AI')" id="tab-AI">AI</button>
            <button class="tab-pill" onclick="filterCards('INFRA')" id="tab-INFRA">INFRASTRUCTURE</button>
            <button class="tab-pill" onclick="filterCards('NETWORK')" id="tab-NETWORK">NETWORK</button>
            <button class="tab-pill" onclick="filterCards('ORG')" id="tab-ORG">ORGANIZING</button>
            <button class="tab-pill" onclick="filterCards('SERVICE')" id="tab-SERVICE">SERVICE</button>
        </div>
    </div>

    <main class="flex-1 p-6 md:p-10">
        <div class="max-w-7xl mx-auto space-y-6 pb-20">

            <!-- Sub Header Info Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                <div class="flex flex-wrap items-center gap-1.5" id="chip-list-bar">
                    <!-- Quick Jump Chips -->
                </div>
                <div class="flex items-center gap-2 self-end sm:self-auto shrink-0">
                    <span class="text-xs text-slate-400 font-medium">표시 중:</span>
                    <span id="display-count" class="text-sm font-bold text-slate-900 bg-slate-100 px-2.5 py-0.5 rounded-md border border-slate-200">15개 기관</span>
                </div>
            </div>

            <!-- Card Grid -->
            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script>
        let currentFilter = 'ALL';

        function filterCards(filterType) {
            currentFilter = filterType;
            const grid = document.getElementById('card-grid');
            const countEl = document.getElementById('display-count');
            const chipBar = document.getElementById('chip-list-bar');

            // Update tab button styles
            document.querySelectorAll('.tab-pill').forEach(btn => {
                btn.classList.remove('active');
            });

            const activeBtn = document.getElementById(`tab-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }

            // Get filtered list
            let list = getCompaniesByDomain(filterType);
            countEl.innerText = `${list.length}개 기관`;

            // Quick Chips
            chipBar.innerHTML = '';
            list.forEach(c => {
                const chip = document.createElement('button');
                chip.className = "text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 transition-colors flex items-center gap-1.5";
                chip.innerHTML = `${c.name}`;
                chip.onclick = () => scrollToCard(c.id);
                chipBar.appendChild(chip);
            });

            // Render Card Grid
            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `saas-card p-6 flex flex-col justify-between cursor-pointer group`;
                card.onclick = () => showCompanyPopup(item);

                // Domain Tag Colors & Labels
                const domainTagMap = {
                    ORG: { label: 'ORGANIZING', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
                    DATA: { label: 'DATA', cls: 'bg-teal-100 text-teal-800 border-teal-200' },
                    AI: { label: 'AI', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
                    INFRA: { label: 'INFRASTRUCTURE', cls: 'bg-purple-100 text-purple-800 border-purple-200' },
                    NETWORK: { label: 'NETWORK', cls: 'bg-orange-100 text-orange-800 border-orange-200' },
                    SERVICE: { label: 'SERVICE', cls: 'bg-rose-100 text-rose-800 border-rose-200' }
                };
                const tagInfo = domainTagMap[item.type] || { label: item.type, cls: 'bg-slate-100 text-slate-700 border-slate-200' };

                // First KPI value
                const primaryKpi = item.results && item.results.kpis ? item.results.kpis[0] : null;

                card.innerHTML = `
                    <div>
                        <!-- Header Badges -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${tagInfo.cls}">${tagInfo.label}</span>
                            <span class="text-[10px] font-semibold text-slate-400">${item.category || '참여'}</span>
                        </div>

                        <!-- Company Name & Role -->
                        <h3 class="text-base font-bold text-slate-900 group-hover:text-blue-600 transition-colors leading-snug mb-0.5">${item.name}</h3>
                        <p class="text-xs font-semibold text-slate-400 mb-3 truncate">${item.role}</p>

                        <!-- Description -->
                        <p class="text-xs text-slate-600 leading-relaxed line-clamp-3 mb-4 bg-slate-50/70 p-3 rounded-xl border border-slate-100">
                            ${item.desc}
                        </p>

                        <!-- Key KPI Preview -->
                        ${primaryKpi ? `
                            <div class="mb-4 p-3 rounded-xl bg-white border border-slate-200/80">
                                <div class="text-[10px] font-medium text-slate-400 truncate mb-1">${primaryKpi.label}</div>
                                <div class="flex items-baseline justify-between">
                                    <span class="text-sm font-extrabold text-slate-900">${primaryKpi.value} <span class="text-[10px] font-normal text-slate-500">${primaryKpi.unit || ''}</span></span>
                                    ${primaryKpi.target ? `<span class="text-[10px] font-medium text-slate-400">목표: ${primaryKpi.target}${primaryKpi.unit||''}</span>` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Footer -->
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[11px] font-medium text-slate-400">산출물 ${item.results ? item.results.deliverables.length : 0}건</span>
                        <div class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 group-hover:bg-slate-900 group-hover:text-white flex items-center justify-center transition-all">
                            <i class="fas fa-arrow-right text-[10px]"></i>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function scrollToCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('ring-2', 'ring-blue-600');
                setTimeout(() => card.classList.remove('ring-2', 'ring-blue-600'), 2000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialType = urlParams.get('type') || 'ALL';
            filterCards(initialType);
        });
    </script>
</body>
</html>
