<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners - 초거대 제조 AI 참여기관</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="popup.js"></script>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        /* ── Modern Topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E2E8F0;
        }

        /* ── Photo Hero ── */
        .page-hero {
            background:
                linear-gradient(100deg, rgba(25, 31, 40, 0.94) 0%, rgba(25, 31, 40, 0.80) 45%, rgba(25, 31, 40, 0.50) 100%),
                url('images/bg_team.jpg') center 62% / cover no-repeat;
        }
        .page-body { background: #F1F5F9; padding-top: 1px; }

        /* ── SaaS Card Design ── */
        .saas-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card.cursor-pointer:hover {
            background: #FBFDFF;
            border-color: #3B82F6;
            box-shadow: 0 0 0 1px #3B82F6, 0 20px 40px -12px rgba(37, 99, 235, 0.35);
            transform: translateY(-4px);
        }

        /* ── Header Tabs (밑줄형, 페이지명과 한 줄) ── */
        .tab-pill {
            position: relative;
            padding: 12px 2px;
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s;
        }
        @media (min-width: 768px) { .tab-pill { padding: 19px 2px; } }
        .tab-pill::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px; border-radius: 2px;
            background: transparent;
            transition: background 0.2s;
        }
        .tab-pill:hover { color: #191F28; }
        .tab-pill:hover::after { background: #CBD5E1; }
        .tab-pill.active { color: #191F28; }
        .tab-pill.active::after { background: #191F28; }

        .no-scrollbar::-webkit-scrollbar { display: none; height: 0; width: 0; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background-color: transparent; }
    </style>
    <link rel="stylesheet" href="dashboard-readability.css">
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Top Navigation Header (페이지명 + 탭 한 줄) -->
    <div class="topbar shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 flex flex-col md:flex-row md:items-center md:justify-between md:gap-8 md:h-14">
            <div class="flex items-center gap-2.5 h-12 md:h-auto shrink-0">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <span class="text-sm font-bold text-slate-900 tracking-tight">PARTNERS</span>
                
            </div>
            <nav class="flex items-center gap-5 md:gap-6 overflow-x-auto no-scrollbar">
                <button class="tab-pill active shrink-0" onclick="filterCards('ALL')" id="tab-ALL">ALL</button>
                <button class="tab-pill shrink-0" onclick="filterCards('DATA')" id="tab-DATA">DATA</button>
                <button class="tab-pill shrink-0" onclick="filterCards('AI')" id="tab-AI">AI</button>
                <button class="tab-pill shrink-0" onclick="filterCards('INFRA')" id="tab-INFRA">INFRASTRUCTURE</button>
                <button class="tab-pill shrink-0" onclick="filterCards('NETWORK')" id="tab-NETWORK">NETWORK</button>
                <button class="tab-pill shrink-0" onclick="filterCards('ORG')" id="tab-ORG">ORGANIZING</button>
                <button class="tab-pill shrink-0" onclick="filterCards('SERVICE')" id="tab-SERVICE">SERVICE</button>
            </nav>
        </div>
    </div>

    <!-- Photo Hero -->
    <div class="page-hero">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 pt-9 md:pt-11 pb-20 md:pb-24">
            <div class="inline-flex items-center px-2.5 py-1 rounded-md bg-white/10 border border-white/20 text-white/80 text-[11px] font-bold uppercase tracking-wider mb-4">Partners</div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-tight break-keep">함께하는 참여기관</h1>
            <p class="text-xs md:text-sm font-medium text-slate-300 mt-3 break-keep">주관기관 1곳과 참여기관 15곳이 데이터 · AI · 인프라 · 네트워크 · 사업관리 · 서비스 6대 도메인에서 함께합니다.</p>
        </div>
    </div>

    <main class="flex-1 page-body">
        <div class="max-w-7xl mx-auto space-y-6 px-6 md:px-10 pb-20">

            <!-- Sub Header Info Bar (히어로 위로 겹침) -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden -mt-14 md:-mt-16 relative">
                <div class="flex items-center justify-between p-3.5 px-4 cursor-pointer hover:bg-slate-50 transition-colors" onclick="toggleChipBar()" id="chip-bar-header">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-800" id="chip-bar-title">참여기관 빠른 바로가기</span>
                        <span id="display-count" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100">16개 기관</span>
                    </div>
                    <button class="text-slate-400 hover:text-slate-700 text-xs flex items-center justify-center p-1 rounded hover:bg-slate-100 transition-colors">
                        <i id="chip-toggle-icon" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
                    </button>
                </div>
                <div class="p-4 pt-1 border-t border-slate-100 hidden transition-all" id="chip-list-wrapper">
                    <div class="flex flex-wrap items-center gap-1.5" id="chip-list-bar">
                        <!-- Quick Jump Chips -->
                    </div>
                </div>
            </div>

            <!-- Card Grid -->
            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script>
        let currentFilter = 'ALL';

        function filterCards(filterType) {
            currentFilter = filterType;
            const grid = document.getElementById('card-grid');
            const countEl = document.getElementById('display-count');
            const chipBar = document.getElementById('chip-list-bar');
            const titleEl = document.getElementById('chip-bar-title');

            // Update Header Title according to filter
            if (titleEl) {
                const titleMap = {
                    ALL: '참여기관',
                    DATA: 'DATA',
                    AI: 'AI',
                    INFRA: 'INFRASTRUCTURE',
                    NETWORK: 'NETWORK',
                    ORG: 'ORGANIZING',
                    SERVICE: 'SERVICE'
                };
                const label = titleMap[filterType] || filterType;
                titleEl.innerText = `${label} 빠른 바로가기`;
            }

            // Update tab button styles
            document.querySelectorAll('.tab-pill').forEach(btn => {
                btn.classList.remove('active');
            });

            const activeBtn = document.getElementById(`tab-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }

            // Get filtered list
            let list = getCompaniesByDomain(filterType);
            countEl.innerText = `${list.length}개 기관`;

            // Quick Chips
            chipBar.innerHTML = '';
            list.forEach(c => {
                const chip = document.createElement('button');
                chip.className = "text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-50 hover:bg-[#191F28] hover:text-white hover:border-[#191F28] text-slate-600 border border-slate-200 transition-colors flex items-center gap-1.5";
                chip.innerHTML = `${c.name}`;
                chip.onclick = () => scrollToCard(c.id);
                chipBar.appendChild(chip);
            });

            // Render Card Grid
            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = `saas-card p-6 flex flex-col justify-between cursor-pointer group`;
                card.onclick = () => showCompanyPopup(item);

                // Domain Tag Colors & Labels
                const domainTagMap = {
                    ORG: { label: 'ORGANIZING', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
                    DATA: { label: 'DATA', cls: 'bg-teal-100 text-teal-800 border-teal-200' },
                    AI: { label: 'AI', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
                    INFRA: { label: 'INFRASTRUCTURE', cls: 'bg-purple-100 text-purple-800 border-purple-200' },
                    NETWORK: { label: 'NETWORK', cls: 'bg-orange-100 text-orange-800 border-orange-200' },
                    SERVICE: { label: 'SERVICE', cls: 'bg-rose-100 text-rose-800 border-rose-200' }
                };
                const tagInfo = domainTagMap[item.type] || { label: item.type, cls: 'bg-slate-100 text-slate-700 border-slate-200' };

                // First KPI value
                const primaryKpi = item.results && item.results.kpis ? item.results.kpis[0] : null;

                card.innerHTML = `
                    <div>
                        <!-- Header Badges -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${tagInfo.cls}">${tagInfo.label}</span>
                            <span class="text-[10px] font-semibold text-slate-400">${item.category || '참여'}</span>
                        </div>

                        <!-- Company Name & Role -->
                        <h3 class="text-base font-bold text-slate-900 group-hover:text-blue-600 transition-colors leading-snug mb-0.5">${item.name}</h3>
                        <p class="partner-role text-xs font-semibold text-slate-400 mb-3">${item.role}</p>

                        <!-- Description -->
                        <p class="text-xs text-slate-600 leading-relaxed line-clamp-3 mb-4 bg-slate-50/70 p-3 rounded-xl border border-slate-100">
                            ${item.desc}
                        </p>

                        <!-- Key KPI Preview -->
                        ${primaryKpi ? `
                            <div class="mb-4 p-3 rounded-xl bg-white border border-slate-200/80">
                                <div class="partner-kpi-label text-[10px] font-medium text-slate-400 mb-1">${primaryKpi.label}</div>
                                <div class="partner-kpi-values flex items-baseline justify-between">
                                    <span class="text-sm font-extrabold text-slate-900">${primaryKpi.value} <span class="text-[10px] font-normal text-slate-500">${kpiUnit(primaryKpi)}</span></span>
                                    ${primaryKpi.target ? `<span class="text-[10px] font-medium text-slate-400">목표: ${primaryKpi.target}${primaryKpi.unit||''}</span>` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Footer -->
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[11px] font-medium text-slate-400">산출물 ${item.results ? item.results.deliverables.length : 0}건</span>
                        <div class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 group-hover:bg-slate-900 group-hover:text-white flex items-center justify-center transition-all">
                            <i class="fas fa-arrow-right text-[10px]"></i>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function scrollToCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('ring-2', 'ring-blue-600');
                setTimeout(() => card.classList.remove('ring-2', 'ring-blue-600'), 2000);
            }
        }

        function toggleChipBar() {
            const wrapper = document.getElementById('chip-list-wrapper');
            const icon = document.getElementById('chip-toggle-icon');
            if (!wrapper) return;

            const isHidden = wrapper.classList.contains('hidden');
            if (isHidden) {
                wrapper.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-180');
            } else {
                wrapper.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-180');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialType = urlParams.get('type') || 'ALL';
            filterCards(initialType);

            // PC 화면(640px 이상)일 때는 기본으로 펼쳐짐
            if (window.innerWidth >= 640) {
                toggleChipBar();
            }
        });
    </script>
</body>
</html>
