<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners - 초거대 제조 AI 참여기관</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="popup.js"></script>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        /* ── Modern Topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E2E8F0;
        }

        /* ── Photo Hero ── */
        .page-hero {
            background:
                linear-gradient(100deg, rgba(25, 31, 40, 0.94) 0%, rgba(25, 31, 40, 0.80) 45%, rgba(25, 31, 40, 0.50) 100%),
                url('images/bg_team.jpg') center 62% / cover no-repeat;
        }
        .page-body { background: #F1F5F9; padding-top: 1px; }

        /* ── SaaS Card Design ── */
        .saas-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card.cursor-pointer:hover {
            background: #FBFDFF;
            border-color: #3B82F6;
            box-shadow: 0 0 0 1px #3B82F6, 0 20px 40px -12px rgba(37, 99, 235, 0.35);
            transform: translateY(-4px);
        }

        /* ── Header Tabs (밑줄형, 페이지명과 한 줄) ── */
        .tab-pill {
            position: relative;
            padding: 12px 2px;
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s;
        }
        @media (min-width: 768px) { .tab-pill { padding: 19px 2px; } }
        .tab-pill::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px; border-radius: 2px;
            background: transparent;
            transition: background 0.2s;
        }
        .tab-pill:hover { color: #191F28; }
        .tab-pill:hover::after { background: #CBD5E1; }
        .tab-pill.active { color: #191F28; }
        .tab-pill.active::after { background: #191F28; }

        .no-scrollbar::-webkit-scrollbar { display: none; height: 0; width: 0; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background-color: transparent; }

        /* ── 선택 도메인 안내 줄 (히어로 위로 겹침) ── */
        .filter-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 16px 20px; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 12px 32px -14px rgba(15, 23, 42, .22); }
        .filter-bar strong { font-size: 16px; font-weight: 800; color: #0F172A; }
        .filter-bar span { font-size: 13px; color: #64748B; }

        /* ── 기관 카드: 글은 줄이고 달성 여부는 아이콘·숫자로 ── */
        .org-card { display: flex; flex-direction: column; padding: 22px 24px; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
        .org-card:hover { border-color: #93B4EE; box-shadow: 0 10px 24px -16px rgba(37, 99, 235, .45); }
        .org-card:focus-visible { outline: 3px solid #93B4EE; outline-offset: 3px; }
        .org-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
        .org-tags { display: flex; align-items: center; gap: 8px; }
        .org-tag { padding: 1px 7px; border-radius: 4px; border: 1px solid; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
        .org-lead { font-size: 12px; font-weight: 700; color: #2563EB; }
        .org-name { margin-top: 10px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; color: #0F172A; transition: color .15s; }
        .org-card:hover .org-name { color: #1D4ED8; }
        .org-role { margin-top: 3px; font-size: 13px; line-height: 1.5; color: #64748B; word-break: keep-all; }
        .org-score { flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
        .org-score strong { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: #0F172A; }
        .org-score strong small { margin-left: 1px; font-size: 16px; font-weight: 700; letter-spacing: 0; color: #94A3B8; }
        .org-score.is-all strong { color: #2563EB; }
        .org-score span { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; color: #64748B; }
        .kpi-list { margin-top: 18px; padding-top: 6px; border-top: 1px solid #F1F5F9; }
        .kpi-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        .kpi-row + .kpi-row { border-top: 1px dashed #EEF2F6; }
        .kpi-icon { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #CBD5E1; color: transparent; font-size: 7px; }
        .kpi-icon.is-done { background: #2563EB; border-color: #2563EB; color: #fff; }
        .kpi-icon.is-pending { border-style: dashed; }
        .kpi-row-label { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; color: #334155; word-break: keep-all; overflow-wrap: anywhere; }
        .kpi-row-value { flex-shrink: 0; max-width: 58%; text-align: right; font-size: 14px; font-weight: 800; color: #0F172A; font-variant-numeric: tabular-nums; }
        .kpi-row-value > span, .kpi-row-value small { white-space: nowrap; }
        .kpi-row-value small { display: inline-block; font-size: 12px; font-weight: 500; color: #94A3B8; }
        .kpi-row-value.is-text { font-size: 12px; font-weight: 600; color: #64748B; }
        .deliverables { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 16px; }
        .deliverable-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 10px; border-radius: 9999px; background: #F1F5F9; font-size: 12px; font-weight: 500; color: #475569; }
        .deliverable-chip i { color: #94A3B8; font-size: 11px; }
        .deliverable-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .deliverable-chip.is-more { color: #64748B; }
        @media (max-width: 639px) { .org-card { padding: 20px; } }
    </style>
    <link rel="stylesheet" href="dashboard-readability.css">
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Top Navigation Header (페이지명 + 탭 한 줄) -->
    <div class="topbar shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 flex flex-col md:flex-row md:items-center md:justify-between md:gap-8 md:h-14">
            <div class="flex items-center gap-2.5 h-12 md:h-auto shrink-0">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <span class="text-sm font-bold text-slate-900 tracking-tight">PARTNERS</span>
                
            </div>
            <nav class="flex items-center gap-5 md:gap-6 overflow-x-auto no-scrollbar">
                <button class="tab-pill active shrink-0" onclick="filterCards('ALL')" id="tab-ALL">ALL</button>
                <button class="tab-pill shrink-0" onclick="filterCards('DATA')" id="tab-DATA">DATA</button>
                <button class="tab-pill shrink-0" onclick="filterCards('AI')" id="tab-AI">AI</button>
                <button class="tab-pill shrink-0" onclick="filterCards('INFRA')" id="tab-INFRA">INFRASTRUCTURE</button>
                <button class="tab-pill shrink-0" onclick="filterCards('NETWORK')" id="tab-NETWORK">NETWORK</button>
                <button class="tab-pill shrink-0" onclick="filterCards('ORG')" id="tab-ORG">ORGANIZING</button>
                <button class="tab-pill shrink-0" onclick="filterCards('SERVICE')" id="tab-SERVICE">SERVICE</button>
            </nav>
        </div>
    </div>

    <!-- Photo Hero -->
    <div class="page-hero">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 pt-9 md:pt-11 pb-20 md:pb-24">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-tight break-keep">함께하는 참여기관</h1>
            <p class="text-xs md:text-sm font-medium text-slate-300 mt-3 break-keep">주관기관 1곳과 참여기관 15곳이 데이터, AI, 인프라, 네트워크, 사업관리, 서비스 6대 도메인에서 함께합니다. 카드를 누르면 기관의 상세 자료를 볼 수 있습니다.</p>
        </div>
    </div>

    <main class="flex-1 page-body">
        <div class="max-w-7xl mx-auto space-y-6 px-6 md:px-10 pb-20">

            <!-- 선택한 도메인과 기관 수 (히어로 위로 겹침) -->
            <div class="filter-bar -mt-14 md:-mt-16 relative">
                <strong id="filter-title">전체 참여기관</strong>
                <span id="display-count">16곳</span>
            </div>

            <!-- Card Grid -->
            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script>
        let currentFilter = 'ALL';

        function filterCards(filterType) {
            currentFilter = filterType;
            const grid = document.getElementById('card-grid');
            const countEl = document.getElementById('display-count');
            const titleEl = document.getElementById('filter-title');

            // 선택한 도메인 이름 (Overview 6대 핵심 도메인과 같은 이름)
            const titleMap = {
                ALL: '전체 참여기관',
                DATA: '제조 데이터 수집 및 교환',
                AI: '제조 특화 AI 모델 개발',
                INFRA: '하이브리드 클라우드 & MLOps',
                NETWORK: '차세대 초고속 통신망',
                ORG: '사업관리 및 생태계 활성화',
                SERVICE: '현장 응용 서비스 및 실증'
            };
            titleEl.innerText = titleMap[filterType] || filterType;

            // Update tab button styles
            document.querySelectorAll('.tab-pill').forEach(btn => {
                btn.classList.remove('active');
            });

            const activeBtn = document.getElementById(`tab-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }

            // Get filtered list
            let list = getCompaniesByDomain(filterType);
            countEl.innerText = `${list.length}곳`;

            // Render Card Grid
            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'org-card';
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `${item.name} 상세 자료 보기`);
                card.onclick = () => showCompanyPopup(item);
                card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showCompanyPopup(item); } };

                // Domain Tag Colors & Labels
                const domainTagMap = {
                    ORG: { label: 'ORGANIZING', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
                    DATA: { label: 'DATA', cls: 'bg-teal-100 text-teal-800 border-teal-200' },
                    AI: { label: 'AI', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
                    INFRA: { label: 'INFRASTRUCTURE', cls: 'bg-purple-100 text-purple-800 border-purple-200' },
                    NETWORK: { label: 'NETWORK', cls: 'bg-orange-100 text-orange-800 border-orange-200' },
                    SERVICE: { label: 'SERVICE', cls: 'bg-rose-100 text-rose-800 border-rose-200' }
                };
                const tagInfo = domainTagMap[item.type] || { label: item.type, cls: 'bg-slate-100 text-slate-700 border-slate-200' };

                const kpis = (item.results && item.results.kpis) || [];
                const deliverables = (item.results && item.results.deliverables) || [];
                const achievedCount = kpis.filter(k => isKpiMeasured(k) && isKpiAchieved(k)).length;

                card.innerHTML = `
                    <div class="org-head">
                        <div class="min-w-0">
                            <div class="org-tags">
                                <span class="org-tag ${tagInfo.cls}">${tagInfo.label}</span>
                                ${item.category === '주관' ? '<span class="org-lead">주관기관</span>' : ''}
                            </div>
                            <h3 class="org-name">${item.name}</h3>
                            <p class="org-role">${item.role}</p>
                        </div>
                        ${kpis.length ? `
                        <div class="org-score${achievedCount === kpis.length ? ' is-all' : ''}">
                            <strong>${achievedCount}<small>/${kpis.length}</small></strong>
                            <span>지표 달성</span>
                        </div>` : ''}
                    </div>

                    ${kpis.length ? `<div class="kpi-list">${kpis.map(kpiRowHtml).join('')}</div>` : ''}

                    ${deliverables.length ? `
                    <div class="deliverables" title="산출물 ${deliverables.length}건">
                        ${deliverables.slice(0, 2).map(d => `<span class="deliverable-chip"><i class="fa-regular fa-file-lines" aria-hidden="true"></i><span>${d}</span></span>`).join('')}
                        ${deliverables.length > 2 ? `<span class="deliverable-chip is-more">외 ${deliverables.length - 2}건</span>` : ''}
                    </div>` : ''}
                `;

                grid.appendChild(card);
            });
        }

        // 지표 한 줄: 달성 아이콘, 지표명, "실적 / 목표"
        function kpiRowHtml(kpi) {
            const measured = isKpiMeasured(kpi);
            const done = measured && isKpiAchieved(kpi);
            const iconHtml = `<span class="kpi-icon${done ? ' is-done' : measured ? '' : ' is-pending'}" aria-label="${done ? '달성' : measured ? '진행 중' : '측정 전'}">${done ? '<i class="fas fa-check"></i>' : ''}</span>`;
            const valueHtml = measured
                ? `<span>${kpi.value}${kpiUnit(kpi)}</span>${kpi.target ? ` <small>/ ${kpiTarget(kpi)}</small>` : ''}`
                : kpi.value;
            const rateText = measured && kpi.achievement != null ? ` (달성률 ${Math.round(kpi.achievement)}%)` : '';
            return `
                <div class="kpi-row" title="${kpi.label}${rateText}">
                    ${iconHtml}
                    <span class="kpi-row-label">${kpi.label}</span>
                    <span class="kpi-row-value${measured ? '' : ' is-text'}">${valueHtml}</span>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialType = urlParams.get('type') || 'ALL';
            filterCards(initialType);
        });
    </script>
</body>
</html>
