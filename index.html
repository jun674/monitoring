<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초거대제조AI 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        ::-webkit-scrollbar-track { background-color: transparent; }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-50 text-slate-800">

    <aside id="sidebar" class="w-56 flex flex-col bg-[#191F28] shadow-xl z-10 transition-all duration-300 shrink-0">
        <div class="p-4 border-b border-white/10 flex items-center justify-between gap-2" id="sidebar-header">
            <div class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition-opacity min-w-0" id="logo-and-title" onclick="loadFile(files[0])">
                <div class="w-8 h-8 bg-white rounded-md flex items-center justify-center text-slate-900 font-extrabold text-sm shadow shrink-0">AI</div>
                <div class="sidebar-label min-w-0">
                    <h1 class="text-base font-bold text-white tracking-tight truncate">초거대제조AI</h1>
                    <p class="text-[10px] text-slate-400 tracking-tight truncate">Analytics Dashboard</p>
                </div>
            </div>
            <button id="sidebar-toggle" class="text-slate-400 hover:text-white transition-colors p-1 shrink-0 rounded hover:bg-white/10" title="사이드바 토글">
                <i class="fas fa-chevron-left text-xs transition-transform duration-300"></i>
            </button>
        </div>
        <nav id="file-list" class="flex-1 overflow-y-auto py-2 px-0 space-y-0.5"></nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <iframe id="viewer" class="flex-1 w-full h-full border-none"></iframe>
    </main>

    <script>
        const fileList = document.getElementById('file-list');
        const viewer = document.getElementById('viewer');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const toggleIcon = sidebarToggle.querySelector('i');
        const sidebarHeader = document.getElementById('sidebar-header');
        const logoAndTitle = document.getElementById('logo-and-title');

        const files = [
            { 
                name: "OVERVIEW", 
                path: "overview.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>` 
            },
            { 
                name: "PIPELINE", 
                path: "pipeline.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="6" height="6" rx="1"/><rect x="16" y="3" width="6" height="6" rx="1"/><rect x="9" y="15" width="6" height="6" rx="1"/><path d="M5 9v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M12 14v1"/></svg>` 
            },
            { 
                name: "PARTNERS", 
                path: "partners.html", 
                svg: `<svg class="w-5 h-5 shrink-0 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` 
            },
        ];

        function loadFile(file) {
            viewer.src = file.path;
            updateActiveLink(file.path);
        }

        window.navigateToPage = function(path, filterType) {
            const targetUrl = filterType ? `${path}?type=${filterType}` : path;
            viewer.src = targetUrl;
            updateActiveLink(path);
        };

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'navigateToPage') {
                navigateToPage(e.data.path, e.data.filterType);
            }
        });

        function updateActiveLink(path) {
            const links = fileList.querySelectorAll('a');
            links.forEach(link => {
                const isActive = link.dataset.path === path;
                if (isActive) {
                    link.className = 'flex items-center w-full px-5 py-3 text-sm font-bold rounded-none bg-white text-[#191F28] transition-all duration-200 group';
                } else {
                    link.className = 'flex items-center w-full px-5 py-3 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white rounded-none transition-all duration-200 group';
                }
            });
        }

        files.forEach(file => {
            const a = document.createElement('a');
            a.href = '#';
            a.dataset.path = file.path;
            a.title = file.name;
            a.className = 'flex items-center w-full px-5 py-3 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white rounded-none transition-all duration-200 group';
            
            a.innerHTML = `
                <div class="sidebar-icon w-6 shrink-0 flex items-center justify-center hidden">${file.svg}</div>
                <span class="sidebar-label truncate whitespace-nowrap">${file.name}</span>
            `;
            
            a.onclick = (e) => {
                e.preventDefault();
                loadFile(file);
            };
            fileList.appendChild(a);
        });

        if (files.length > 0) {
            loadFile(files[0]);
        }

        sidebarToggle.addEventListener('click', () => {
            const isCollapsing = sidebar.classList.contains('w-56');
            const labels = document.querySelectorAll('.sidebar-label');
            const icons = document.querySelectorAll('.sidebar-icon');

            if (isCollapsing) {
                sidebar.classList.replace('w-56', 'w-16');
                logoAndTitle.classList.add('hidden');
                sidebarHeader.classList.replace('justify-between', 'justify-center');
                labels.forEach(el => el.classList.add('hidden'));
                icons.forEach(el => el.classList.remove('hidden'));
                toggleIcon.classList.add('rotate-180');
            } else {
                sidebar.classList.replace('w-16', 'w-56');
                logoAndTitle.classList.remove('hidden');
                sidebarHeader.classList.replace('justify-center', 'justify-between');
                labels.forEach(el => el.classList.remove('hidden'));
                icons.forEach(el => el.classList.add('hidden'));
                toggleIcon.classList.remove('rotate-180');
            }
        });
    </script>
</body>
</html>
