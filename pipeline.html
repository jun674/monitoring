<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline - 서비스 플로우</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="popup.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        /* ── Modern Topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E2E8F0;
        }

        /* ── Header Tabs (밑줄형, 페이지명과 한 줄) ── */
        .tab-btn {
            position: relative;
            padding: 12px 2px;
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s;
        }
        @media (min-width: 768px) { .tab-btn { padding: 19px 2px; } }
        .tab-btn::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px; border-radius: 2px;
            background: transparent;
            transition: background 0.2s;
        }
        .tab-btn:hover { color: #191F28; }
        .tab-btn:hover::after { background: #CBD5E1; }
        .tab-btn.active { color: #191F28; }
        .tab-btn.active::after { background: #191F28; }

        /* ── Photo Hero ── */
        .page-hero {
            background:
                linear-gradient(100deg, rgba(25, 31, 40, 0.94) 0%, rgba(25, 31, 40, 0.80) 45%, rgba(25, 31, 40, 0.50) 100%),
                url('images/bg_network.jpg') center / cover no-repeat;
        }
        .page-body { background: #F1F5F9; padding-top: 1px; }

        /* ── Stage Band ── */
        .stage-section { scroll-margin-top: 112px; transition: box-shadow 0.5s ease, border-color 0.5s ease; }
        /* 상단 탭으로 이동한 단계 표시 */
        .stage-section.is-target {
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px #3B82F6, 0 20px 40px -12px rgba(37, 99, 235, 0.35);
        }
        .stage-section.is-target .stage-badge { animation: stage-pulse 0.9s ease-out 2; }
        @keyframes stage-pulse {
            0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.55); }
            100% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }
        .layer-band {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
        }

        /* ── Partner Node ── */
        .node {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .node.clickable { cursor: pointer; }
        .node.clickable:hover {
            background: #FFFFFF;
            border-color: #3B82F6;
            box-shadow: 0 0 0 1px #3B82F6, 0 14px 28px -10px rgba(37, 99, 235, 0.4);
            transform: translateY(-3px);
        }
        .node .node-name, .node .node-arrow { transition: color 0.2s, transform 0.2s; }
        .node.clickable:hover .node-name { color: #2563EB; }
        .node.clickable:hover .node-arrow { color: #2563EB; opacity: 1; transform: translateX(3px); }

        /* ── Flow Connector ── */
        .flow {
            position: relative;
            padding-left: 52px;
        }
        .flow::before {
            content: '';
            position: absolute;
            left: 31px; top: 0; bottom: 0;
            border-left: 2px dashed #CBD5E1;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background-color: transparent; }

        .no-scrollbar::-webkit-scrollbar { display: none; height: 0; width: 0; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Header (페이지명 + 탭 한 줄) -->
    <div class="topbar shrink-0">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 md:px-10 flex flex-col md:flex-row md:items-center md:justify-between md:gap-8 md:h-14">
            <div class="flex items-center gap-2.5 h-12 md:h-auto shrink-0">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <span class="text-sm font-bold text-slate-900 tracking-tight">PIPELINE</span>
                
            </div>
            <nav class="flex items-center gap-5 md:gap-6 overflow-x-auto no-scrollbar topbar-tabs" id="stage-tabs"></nav>
        </div>
    </div>

    <!-- Photo Hero -->
    <div class="page-hero">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 md:px-10 pt-9 md:pt-11 pb-9 md:pb-11">
            <div class="inline-flex items-center px-2.5 py-1 rounded-md bg-white/10 border border-white/20 text-white/80 text-[11px] font-bold uppercase tracking-wider mb-4">Pipeline</div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-tight break-keep">EBC 중심 기관 간 연계 구조</h1>
            <p class="text-xs md:text-sm font-medium text-slate-300 mt-3 break-keep">수요기업 현장 데이터가 수집 · 전송 · 표준화 · AI 분석을 거쳐 현장 서비스로 돌아오는 흐름입니다. 기관명을 누르면 상세 성과를 볼 수 있습니다.</p>
        </div>
    </div>

    <main class="flex-1 page-body">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 md:px-10 pt-8 md:pt-10 pb-16">

            <div id="layer-container"></div>

            <!-- Management band -->
            <section id="stage-6" class="stage-section mt-8 layer-band p-4 sm:p-5 border-dashed"></section>
        </div>
    </main>

    <script src="data.js"></script>
    <script>
        const stageMeta = [
            { id: 0, tab: '00. Field',    title: '수요기업 현장',   sub: 'Field Sites' },
            { id: 1, tab: '01. Data',     title: '데이터 수집',     sub: 'Data Collection · OT / IT 데이터 수집' },
            { id: 2, tab: '02. Transfer', title: '데이터 전송',     sub: 'Transfer · 초고속 특화망' },
            { id: 3, tab: '03. Platform', title: 'Platform & AAS', sub: 'EBC 통합 운영환경 · 국제 표준화', hub: true },
            { id: 4, tab: '04. AI',       title: 'AI 분석',         sub: 'AI Analysis · 제조 특화 AI 모델링' },
            { id: 5, tab: '05. App',      title: '응용 서비스',     sub: 'Application · 현장 응용 서비스 실증' },
            { id: 6, tab: '06. Mgmt',     title: '전 과정 관리 · 품질 검증', sub: 'Management' }
        ];

        function nodeHtml(node) {
            const company = node.id ? getCompanyById(node.id) : null;
            const name = company ? company.name : node.name;
            const text = company ? (pipelineFlow.nodeText[node.id] || company.desc) : node.text;
            const isHub = company && pipelineFlow.hubIds.includes(node.id);
            return `
                <div class="node p-3.5 ${company ? 'clickable' : ''}"
                     ${company ? `onclick="showCompanyPopup(getCompanyById('${node.id}'))"` : ''}>
                    <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="node-name text-sm font-bold">${name}</span>
                        ${company
                            ? `<span class="flex items-center gap-2">
                                   ${isHub ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100">EBC</span>' : ''}
                                   <i class="node-arrow fas fa-arrow-right text-[10px] opacity-40"></i>
                               </span>`
                            : '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-100">수요기업</span>'}
                    </div>
                    <p class="text-[11px] leading-snug opacity-70">${text}</p>
                </div>
            `;
        }

        function gridCols(count) {
            return count >= 4 ? 'sm:grid-cols-2 lg:grid-cols-3'
                 : count === 3 ? 'sm:grid-cols-3'
                 : count === 2 ? 'sm:grid-cols-2' : '';
        }

        function flowHtml(text, loop) {
            return `
                <div class="flow py-4">
                    <span class="text-xs font-semibold break-keep ${loop ? 'text-blue-700' : 'text-slate-700'}">
                        <i class="fas ${loop ? 'fa-rotate-left text-blue-600' : 'fa-arrow-down text-slate-400'} mr-1.5"></i>${text}
                    </span>
                </div>
            `;
        }

        function renderPipeline() {
            const container = document.getElementById('layer-container');
            const flowStages = stageMeta.filter(s => s.id <= 5);

            container.innerHTML = flowStages.map(stage => {
                const nodes = stage.id === 0
                    ? pipelineFlow.fieldSites
                    : getCompaniesByStage(stage.id).map(c => ({ id: c.id }));
                const next = pipelineFlow.links[`${stage.id}-${stage.id + 1}`];

                return `
                    <section id="stage-${stage.id}" class="stage-section layer-band p-4 sm:p-5">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="stage-badge w-8 h-8 rounded-xl ${stage.id === 0 ? 'bg-blue-500 text-white' : 'bg-slate-900 text-white'} font-bold text-xs flex items-center justify-center shrink-0">
                                ${stage.id === 0 ? '<i class="fas fa-industry"></i>' : String(stage.id).padStart(2, '0')}
                            </span>
                            <div>
                                <h2 class="text-sm font-bold">${stage.title}</h2>
                                <p class="text-[11px] text-slate-500 font-medium">${stage.sub}</p>
                            </div>
                            ${stage.hub ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100">HUB</span>' : ''}
                        </div>
                        <div class="grid grid-cols-1 ${gridCols(nodes.length)} gap-3">
                            ${nodes.map(nodeHtml).join('')}
                        </div>
                    </section>
                    ${next ? flowHtml(next, false) : ''}
                `;
            }).join('');

            // 응용 서비스 → 다시 수요기업 현장으로 순환
            container.insertAdjacentHTML('beforeend', `
                ${flowHtml('수요기업 현장 실증', true)}
                <div class="layer-band p-4 flex items-center gap-3 bg-blue-50/50 border-blue-100">
                    <i class="fas fa-industry text-blue-600"></i>
                    <span class="text-xs font-semibold text-slate-700">${pipelineFlow.fieldLoop}</span>
                </div>
            `);

            const mgmt = stageMeta[6];
            document.getElementById('stage-6').innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-clipboard-check text-blue-600 text-sm"></i>
                    <h2 class="text-sm font-bold text-slate-900">${mgmt.title}</h2>
                    <span class="text-[11px] text-slate-400">모든 단계에 걸쳐</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${getCompaniesByStage(6).map(c => nodeHtml({ id: c.id })).join('')}
                </div>
            `;
        }

        function renderTabs() {
            document.getElementById('stage-tabs').innerHTML = stageMeta.map(s => `
                <button class="tab-btn shrink-0 ${s.id === 0 ? 'active' : ''}" id="tab-stage-${s.id}" onclick="scrollToSection('stage-${s.id}')">${s.tab}</button>
            `).join('');
        }

        function setActiveTab(stageId) {
            document.querySelectorAll('.topbar-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${stageId}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        let targetTimer = null;
        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) {
                setActiveTab(id);
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });

                // 이동한 단계를 잠시 파란 테두리로 표시
                document.querySelectorAll('.stage-section.is-target').forEach(s => s.classList.remove('is-target'));
                clearTimeout(targetTimer);
                el.classList.add('is-target');
                targetTimer = setTimeout(() => el.classList.remove('is-target'), 2200);
            }
        }

        window.addEventListener('scroll', () => {
            let currentStage = 'stage-0';
            document.querySelectorAll('.stage-section').forEach(section => {
                if (section.getBoundingClientRect().top <= 160) currentStage = section.id;
            });
            if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) currentStage = 'stage-6';
            setActiveTab(currentStage);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderPipeline();
        });
    </script>
</body>
</html>
