<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline - 서비스 플로우</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="popup.js"></script>
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background-color: #F8FAFC;
            color: #0F172A;
            overflow: hidden;
        }

        /* ── Modern Topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E2E8F0;
            padding: 0 28px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ── SaaS Pipeline Card ── */
        .saas-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 18px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 14px 32px -4px rgba(15, 23, 42, 0.14), 0 6px 12px -2px rgba(15, 23, 42, 0.06);
            transform: translateY(-2px);
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #64748B;
            background: #F1F5F9;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        .tab-btn:hover { background: #E2E8F0; color: #0F172A; }
        .tab-btn.active { background: #0F172A; color: #FFFFFF; }

        ::-webkit-scrollbar { height: 8px; width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background-color: #F1F5F9; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <div class="topbar shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            <span class="text-sm font-bold text-slate-900 tracking-tight">PIPELINE</span>
            <span class="text-xs text-slate-400 font-medium hidden sm:inline-block">| 데이터 수집부터 활용까지 6단계 체계</span>
        </div>
        <div class="topbar-tabs flex items-center gap-1.5 overflow-x-auto">
            <button class="tab-btn active" id="tab-stage-1" onclick="scrollToSection('stage-1')">01. Data</button>
            <button class="tab-btn" id="tab-stage-2" onclick="scrollToSection('stage-2')">02. Transfer</button>
            <button class="tab-btn" id="tab-stage-3" onclick="scrollToSection('stage-3')">03. Platform</button>
            <button class="tab-btn" id="tab-stage-4" onclick="scrollToSection('stage-4')">04. AI</button>
            <button class="tab-btn" id="tab-stage-5" onclick="scrollToSection('stage-5')">05. App</button>
            <button class="tab-btn" id="tab-stage-6" onclick="scrollToSection('stage-6')">06. Mgmt</button>
        </div>
    </div>

    <!-- Main Horizontal Pipeline Scroll -->
    <main class="flex-1 flex overflow-x-auto overflow-y-hidden items-start gap-8 p-8" id="main-scroll">

        <!-- Stage 1 -->
        <section id="stage-1" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">01</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Data Collection</h2>
                    <p class="text-[11px] text-slate-500 font-medium">OT / IT 데이터 수집</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-1"></div>
        </section>

        <!-- Stage 2 -->
        <section id="stage-2" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">02</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Transfer (5G)</h2>
                    <p class="text-[11px] text-slate-500 font-medium">초고속 특화망 전송</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-2"></div>
        </section>

        <!-- Stage 3 -->
        <section id="stage-3" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">03</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Platform & AAS</h2>
                    <p class="text-[11px] text-slate-500 font-medium">인프라 및 국제 표준화</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-3"></div>
        </section>

        <!-- Stage 4 -->
        <section id="stage-4" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">04</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">AI Analysis</h2>
                    <p class="text-[11px] text-slate-500 font-medium">제조 특화 AI 모델링</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-4"></div>
        </section>

        <!-- Stage 5 -->
        <section id="stage-5" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">05</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Application</h2>
                    <p class="text-[11px] text-slate-500 font-medium">현장 응용 서비스 실증</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-5"></div>
        </section>

        <!-- Stage 6 -->
        <section id="stage-6" class="stage-section min-w-[340px] flex flex-col gap-4">
            <div class="flex items-center gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center shrink-0">06</span>
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Management</h2>
                    <p class="text-[11px] text-slate-500 font-medium">총괄 및 품질 검증</p>
                </div>
            </div>
            <div class="flex flex-col gap-4" id="container-6"></div>
        </section>

    </main>

    <script src="data.js"></script>
    <script>
        function renderPipeline() {
            const domainTagMap = {
                ORG: { label: 'ORGANIZING', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
                DATA: { label: 'DATA', cls: 'bg-teal-100 text-teal-800 border-teal-200' },
                AI: { label: 'AI', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
                INFRA: { label: 'INFRASTRUCTURE', cls: 'bg-purple-100 text-purple-800 border-purple-200' },
                NETWORK: { label: 'NETWORK', cls: 'bg-orange-100 text-orange-800 border-orange-200' },
                SERVICE: { label: 'SERVICE', cls: 'bg-rose-100 text-rose-800 border-rose-200' }
            };

            companies.forEach((item) => {
                const container = document.getElementById(`container-${item.stage}`);
                if (!container) return;

                const card = document.createElement('div');
                card.className = `saas-card p-5 cursor-pointer flex flex-col justify-between group hover:border-blue-300 transition-all min-h-[170px]`;
                card.onclick = () => showCompanyPopup(item);

                const primaryKpi = item.results && item.results.kpis ? item.results.kpis[0] : null;
                const tagInfo = domainTagMap[item.type] || { label: item.type, cls: 'bg-slate-100 text-slate-600 border-slate-200' };

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${tagInfo.cls}">${tagInfo.label}</span>
                                <h3 class="font-bold text-slate-900 text-sm mt-1 group-hover:text-blue-600 transition-colors">${item.name}</h3>
                                <p class="text-[11px] font-medium text-slate-400 truncate">${item.role}</p>
                            </div>
                            <div class="w-6 h-6 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-slate-900 group-hover:text-white transition-all shrink-0">
                                <i class="fas fa-arrow-right text-[9px]"></i>
                            </div>
                        </div>
                        <p class="text-xs text-slate-500 leading-snug line-clamp-2 mb-3 bg-slate-50 p-2 rounded-lg border border-slate-100">${item.desc}</p>
                    </div>

                    <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs">
                        <span class="text-[10px] font-medium text-slate-400">목표: ${primaryKpi ? `${primaryKpi.value}${primaryKpi.unit||''}` : '—'}</span>
                        <span class="text-[11px] font-semibold text-blue-600">상세보기</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        const scrollContainer = document.getElementById('main-scroll');
        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });

        function setActiveTab(stageId) {
            document.querySelectorAll('.topbar-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${stageId}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        }

        function scrollToSection(id) {
            const el = document.getElementById(id);
            if (el) {
                setActiveTab(id);
                const scrollLeft = el.offsetLeft - 32;
                scrollContainer.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
        }

        let isAutoScrolling = false;
        scrollContainer.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('.stage-section');
            let currentStage = 'stage-1';
            sections.forEach(section => {
                const sectionLeft = section.offsetLeft - scrollContainer.offsetLeft;
                if (scrollContainer.scrollLeft >= sectionLeft - 100) {
                    currentStage = section.id;
                }
            });
            setActiveTab(currentStage);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderPipeline();
        });
    </script>
</body>
</html>
